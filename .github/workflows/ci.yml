name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit and API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ml/requirements.txt
            requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Generated config is up to date
        run: python tools/sync_config.py --check

      - name: Python tests
        run: python -m pytest ml/tests -q

      - name: JavaScript unit and parity tests
        run: npm test

  e2e:
    name: Browser smoke test (TC01 to TC10)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run extension smoke test
        env:
          PYTHON: python
        run: xvfb-run --auto-servernum node tests/e2e/smoke.test.js
